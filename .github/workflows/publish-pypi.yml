name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build package
        run: uv build python
      - name: Verify built package
        run: >-
          uv run --isolated --with python/dist/*.whl python -c
          "import minorun365.card as card;
          assert 'Claude Code' in card.create_content().plain;
          card.sleep = lambda _: None;
          card.main()"
      - name: Publish package
        run: uv publish python/dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
